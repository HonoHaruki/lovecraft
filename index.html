<script>
  const pagesEn = ["I am writing this under an appreciable mental strain, since by tonight I shall be no more. Penniless, and at the end of my supply of the drug which alone, makes life endurable, I can bear the torture no longer; and shall cast myself from this garret window into the squalid street below. Do not think from my slavery to morphine that I am a weakling or a degenerate. When you have read these hastily scrawled pages you may guess, though never fully realise, why it is that I must have forgetfulness or death.", "It was in one of the most open and least frequented parts of the broad Pacific that the packet of which I was supercargo fell a victim to the German sea-raider. The great war was then at its very beginning, and the ocean forces of the Hun had not completely sunk to their later degradation; so that our vessel was made a legitimate prize, whilst we of her crew were treated with all the fairness and consideration due us as naval prisoners. So liberal, indeed, was the discipline of our captors, that five days after we were taken I managed to escape alone in a small boat with water and provisions for a good length of time.", "When I finally found myself adrift and free, I had but little idea of my surroundings. Never a competent navigator, I could only guess vaguely by the sun and stars that I was somewhat south of the equator. Of the longitude I knew nothing, and no island or coastline was in sight. The weather kept fair, and for uncounted days I drifted aimlessly beneath the scorching sun; waiting either for some passing ship, or to be cast on the shores of some habitable land. But neither ship nor land appeared, and I began to despair in my solitude upon the heaving vastness of unbroken blue.", "The change happened whilst I slept. Its details I shall never know; for my slumber, though troubled and dream-infested, was continuous. When at last I awakened, it was to discover myself half sucked into a slimy expanse of hellish black mire which extended about me in monotonous undulations as far as I could see, and in which my boat lay grounded some distance away.", "Though one might well imagine that my first sensation would be of wonder at so prodigious and unexpected a transformation of scenery, I was in reality more horrified than astonished; for there was in the air and in the rotting soil a sinister quality which chilled me to the very core. The region was putrid with the carcasses of decaying fish, and of other less describable things which I saw protruding from the nasty mud of the unending plain. Perhaps I should not hope to convey in mere words the unutterable hideousness that can dwell in absolute silence and barren immensity. There was nothing within hearing, and nothing in sight save a vast reach of black slime; yet the very completeness of the stillness and the homogeneity of the landscape oppressed me with a nauseating fear.", "The sun was blazing down from a sky which seemed to me almost black in its cloudless cruelty; as though reflecting the inky marsh beneath my feet. As I crawled into the stranded boat I realised that only one theory could explain my position. Through some unprecedented volcanic upheaval, a portion of the ocean floor must have been thrown to the surface, exposing regions which for innumerable millions of years had lain hidden under unfathomable watery depths. So great was the extent of the new land which had risen beneath me, that I could not detect the faintest noise of the surging ocean, strain my ears as I might. Nor were there any sea-fowl to prey upon the dead things.", "For several hours I sat thinking or brooding in the boat, which lay upon its side and afforded a slight shade as the sun moved across the heavens. As the day progressed, the ground lost some of its stickiness, and seemed likely to dry sufficiently for travelling purposes in a short time. That night I slept but little, and the next day I made for myself a pack containing food and water, preparatory to an overland journey in search of the vanished sea and possible rescue.", "On the third morning I found the soil dry enough to walk upon with ease. The odour of the fish was maddening; but I was too much concerned with graver things to mind so slight an evil, and set out boldly for an unknown goal. All day I forged steadily westward, guided by a far-away hummock which rose higher than any other elevation on the rolling desert. That night I encamped, and on the following day still travelled toward the hummock, though that object seemed scarcely nearer than when I had first espied it. By the fourth evening I attained the base of the mound, which turned out to be much higher than it had appeared from a distance, an intervening valley setting it out in sharper relief from the general surface. Too weary to ascend, I slept in the shadow of the hill.", "I know not why my dreams were so wild that night; but ere the waning and fantastically gibbous moon had risen far above the eastern plain, I was awake in a cold perspiration, determined to sleep no more. Such visions as I had experienced were too much for me to endure again. And in the glow of the moon I saw how unwise I had been to travel by day. Without the glare of the parching sun, my journey would have cost me less energy; indeed, I now felt quite able to perform the ascent which had deterred me at sunset. Picking up my pack, I started for the crest of the eminence.", "I have said that the unbroken monotony of the rolling plain was a source of vague horror to me; but I think my horror was greater when I gained the summit of the mound and looked down the other side into an immeasurable pit or canyon, whose black recesses the moon had not yet soared high enough to illumine. I felt myself on the edge of the world, peering over the rim into a fathomless chaos of eternal night. Through my terror ran curious reminiscences of Paradise Lost, and Satan's hideous climb through the unfashioned realms of darkness.", "As the moon climbed higher in the sky, I began to see that the slopes of the valley were not quite so perpendicular as I had imagined. Ledges and outcroppings of rock afforded fairly easy footholds for a descent, whilst after a drop of a few hundred feet, the declivity became very gradual. Urged on by an impulse which I cannot definitely analyse, I scrambled with difficulty down the rocks and stood on the gentler slope beneath, gazing into the Stygian deeps where no light had yet penetrated.", "All at once my attention was captured by a vast and singular object on the opposite slope, which rose steeply about a hundred yards ahead of me; an object that gleamed whitely in the newly bestowed rays of the ascending moon. That it was merely a gigantic piece of stone, I soon assured myself; but I was conscious of a distinct impression that its contour and position were not altogether the work of Nature. A closer scrutiny filled me with sensations I cannot express; for despite its enormous magnitude, and its position in an abyss which had yawned at the bottom of the sea since the world was young, I perceived beyond a doubt that the strange object was a well-shaped monolith whose massive bulk had known the workmanship and perhaps the worship of living and thinking creatures.", "Dazed and frightened, yet not without a certain thrill of the scientist's or archaeologist's delight, I examined my surroundings more closely. The moon, now near the zenith, shone weirdly and vividly above the towering steeps that hemmed in the chasm, and revealed the fact that a far-flung body of water flowed at the bottom, winding out of sight in both directions, and almost lapping my feet as I stood on the slope. Across the chasm, the wavelets washed the base of the Cyclopean monolith, on whose surface I could now trace both inscriptions and crude sculptures. The writing was in a system of hieroglyphics unknown to me, and unlike anything I had ever seen in books, consisting for the most part of conventionalised aquatic symbols such as fishes, eels, octopi, crustaceans, molluscs, whales and the like. Several characters obviously represented marine things which are unknown to the modern world, but whose decomposing forms I had observed on the ocean-risen plain.", "It was the pictorial carving, however, that did most to hold me spellbound. Plainly visible across the intervening water on account of their enormous size was an array of bas-reliefs whose subjects would have excited the envy of a Dore. I think that these things were supposed to depict men -- at least, a certain sort of men; though the creatures were shown disporting like fishes in the waters of some marine grotto, or paying homage at some monolithic shrine which appeared to be under the waves as well. Of their faces and forms I dare not speak in detail, for the mere remembrance makes me grow faint. Grotesque beyond the imagination of a Poe or a Bulwer, they were damnably human in general outline despite webbed hands and feet, shockingly wide and flabby lips, glassy, bulging eyes, and other features less pleasant to recall. Curiously enough, they seemed to have been chiselled badly out of proportion with their scenic background; for one of the creatures was shown in the act of killing a whale represented as but little larger than himself. I remarked, as I say, their grotesqueness and strange size; but in a moment decided that they were merely the imaginary gods of some primitive fishing or seafaring tribe; some tribe whose last descendant had perished eras before the first ancestor of the Piltdown or Neanderthal Man was born. Awestruck at this unexpected glimpse into a past beyond the conception of the most daring anthropologist, I stood musing whilst the moon cast queer reflections on the silent channel before me.", "Then suddenly I saw it. With only a slight churning to mark its rise to the surface, the thing slid into view above the dark waters. Vast, Polyphemus-like, and loathsome, it darted like a stupendous monster of nightmares to the monolith, about which it flung its gigantic scaly arms, the while it bowed its hideous head and gave vent to certain measured sounds. I think I went mad then.", "Of my frantic ascent of the slope and cliff, and of my delirious journey back to the stranded boat, I remember little. I believe I sang a great deal, and laughed oddly when I was unable to sing. I have indistinct recollections of a great storm some time after I reached the boat; at any rate, I knew that I heard peals of thunder and other tones which Nature utters only in her wildest moods.", "When I came out of the shadows I was in a San Francisco hospital; brought thither by the captain of the American ship which had picked up my boat in mid-ocean. In my delirium I had said much, but found that my words had been given scant attention. Of any land upheaval in the Pacific, my rescuers knew nothing; nor did I deem it necessary to insist upon a thing which I knew they could not believe. Once I sought out a celebrated ethnologist, and amused him with peculiar questions regarding the ancient Philistine legend of Dagon, the Fish-God; but soon perceiving that he was hopelessly conventional, I did not press my inquiries.", "It is at night, especially when the moon is gibbous and waning, that I see the thing. I tried morphine; but the drug has given only transient surcease, and has drawn me into its clutches as a hopeless slave. So now I am to end it all, having written a full account for the information or the contemptuous amusement of my fellow-men. Often I ask myself if it could not all have been a pure phantasm -- a mere freak of fever as I lay sun-stricken and raving in the open boat after my escape from the German man-of-war. This I ask myself, but ever does there come before me a hideously vivid vision in reply. I cannot think of the deep sea without shuddering at the nameless things that may at this very moment be crawling and floundering on its slimy bed, worshipping their ancient stone idols and carving their own detestable likenesses on submarine obelisks of water-soaked granite. I dream of a day when they may rise above the billows to drag down in their reeking talons the remnants of puny, war-exhausted mankind -- of a day when the land shall sink, and the dark ocean floor shall ascend amidst universal pandemonium.", "The end is near. I hear a noise at the door, as of some immense slippery body lumbering against it. It shall not find me. God, that hand! The window! The window!"];
  const pagesJp = ["かなりのストレスを感じながら、これを書いている。今夜にはもう、生きていないだろう。金も、頼みの綱のクスリも尽きた。これ以上、苦しみには耐えられない。この屋根裏の窓から、下のうす汚い通りに、身を投げることにしよう。モルヒネ中毒が原因で、身体が弱り、精神も堕落したのだと考えないでほしい。乱雑に走り書いたこの文章を読んでもらえば、完全に理解するのは無理にしても、一体全体なぜ私が忘却や死を望んでいるのか、見当はつくと思う。", "船荷監督として乗船していた定期船がドイツの襲撃艇に捕らえられたのは、広い太平洋のなかでも一段と広々として、船の往来がめったにない海域だった。大戦は始まったばかりで、ドイツ人どもの海軍も、後のように落ちぶれきってはいなかった。船は合法的な戦利品にされたといえ、乗組員は海軍の捕虜として、相応の公正さと配慮をもって扱われた。やつらの軍規が実に大らかだったおかげで、拿捕されてから五日後、小さなボートに長期間もつだけの水と食料を積み、ひとり逃げおおすことができた。", "ようやく自由に、そして漂流する身となったが、自分がどこにいるのか、まったく分からない。優れた航海士ではなかったので、太陽と星の位置から、赤道のやや南にいるとなんとなく推測するしかできなかった。緯度についてはまったく分からず、島や海岸線はどこにも見えない。晴れた日がつづき、焼けつくような太陽の下、何日もあてどなく漂流した。通りすがりの船か、人が住める陸地の岸に打ち上げられるのを待っていた。しかし船も陸地も見えてこず、果てしない海の広大なうねりの中に孤立している状態に絶望を感じ始めた。", "状況が変わったのは、寝ている間だった。何が起きたか、詳しくはわからない。というのも、夢にうなされ、よく眠れなかったとはいえ、ずっとまどろんでいたからだ。ようやく目が覚めると、真っ黒な泥のネバネバしたなかに半身が飲み込まれていた。見渡すかぎり、そのぬかるみは単調な起伏としてまわりに広がっていた。少し離れたところに、ボートが乗り上げていた。", "けたはずれの、予想もつかない風景の変化に、まずは驚いたのだろうと思われるかもしれない。しかし、本当のところ、驚きよりも恐怖の方が大きかった。まわりの空気や腐った泥に不吉な気配があって、体の芯まで凍るようだった。辺りにはひどい悪臭が漂っており、腐った死魚や、見たところなんとも言いようのないものの死骸が、果てしなく広がる不潔な泥の平原から突き出ている。完全な静けさの中、不毛な無限の空間に宿る言いようのない恐ろしさは、ひょっとすると言葉だけでは伝わらないかもしれない。何も聞こえず、一面に広がる黒い泥の他は何も見えない。それでも、あたりの静けさが完全なことと、風景が単調なこと、まさにそれらが心に重くのしかかり、吐き気を起こさせるような恐怖を覚えた。", "太陽はぎらぎらと照り、雲ひとつない無慈悲な空は黒いと言ってもよく、あたかも足元の真っ黒な沼地を映すかのようだった。座礁したボートに這うように入り込みながら、この状況を説明する理屈はたった一つしかないと気づいた。火山がかつてない規模で隆起したことで、海底の一部が水面に持ち上がり、底知れぬ深海に何百万年も隠れていた領域が現れたに違いない。足元に現れた新しい土地はだだっ広く、いくら耳を澄ませても、かすか波音さえ聞こえない。そしてまた、死骸をあさる海鳥もいない。", "数時間、ボートの中で考え、思い悩んだ。ボートは側面を下に横たわっており、太陽が空を動くにつれ、わずかな日陰をつくってくれた。時間が経つと、地面のねばつきは少なくなった。もう少しすれば、歩いて動くのに十分なほど乾くように思えた。その夜は、ほとんど眠れなかった。翌日、食料と水をまとめた。消え失せた海と救援の可能性を求めて、陸路を行く準備である。", "三日目の朝、地面は簡単に歩けるほど乾いていた。魚の腐臭はひどかったが、もっと重要なことに関心があったので、そんなささいなことは気にならなかった。そして未知の目標に向け、大胆に出発した。一日中、西へ向かってゆっくり進んで行った。なだらかに起伏する荒れ地の遠くにある、他のところより盛り上がっている丘を目標にした。その夜は野営し、次の日も同じ丘に向けて歩いた。しかし、最初にその丘を見つけた時と比べ、まったく近づいていないようだった。四日目の夕方、丘のふもとにたどり着いた。遠くから見た時より丘はずっと高い。谷があるせいで、周りの平地とくらべて丘の起伏がくっきり分かる。登るには疲れすぎていたので、丘の陰で眠った。", "なぜかは分からないが、その夜は狂気じみた夢を見た。欠け始めの、幻想的な形の月が東の平原に高く昇る前に、冷たい汗をかいて目を覚まし、もう眠らないことに決めた。さっきの夢をもう一度見るのは、とても耐えられないからだ。月の光を浴びながら、日中に歩いてきたのは馬鹿なことをしたと思った。灼熱の太陽がなかったら、歩くのはもっと楽だった。実際、日没時には躊躇したが、今なら丘に登ることができそうな気がした。荷物をまとめ、丘の頂上を目指して出発した。", "起伏する平原の途切れない単調さのせいで、言いようのない恐怖を感じることは以前に書いた。しかし、頂上に着いて丘の反対側にある限りなく深い峡谷を見下ろした時の恐怖はさらにひどいものだった。月はまだ低く、暗い峡谷の奥まで照らしてはいない。まるで自分が世界の果てに立ち、その縁から、永遠に終わらない夜の、底なしの混沌を覗きこんでいるように感じられた。奇妙なことに、恐怖を感じながら、『失楽園』と、形のない闇の国から登ってくる恐ろしい魔王の姿とが、心に浮かんだ。", "月が空高く昇るにつれ、谷の傾斜は思ったより切り立っていないことが分かってきた。岩棚や露出した石が下っていくのに最適な足場になっていて、数百フィートの急な下りを過ぎれば、坂は穏やかになっているようだった。不可解な衝動に駆られ、苦労しながら岩をはい降り、その下のゆるやかな坂に立った。そして、未だ光が射したことのない真っ暗な底を覗きこんだ。", "ふと注意を引かれたのは、前方およそ一〇〇ヤードのところにそそり立つ、向かいの斜面にある大きくて奇妙な物体だった。それは、高度を増す月の光に照らされて、白く輝いていた。巨大な岩石であることは、すぐに分かった。しかし、その形や位置が自然の力だけによるのではないという印象も強く受けた。さらによく見ているうちに、言いようのない感覚を覚えた。途方もなく大きく、海底にぽっかり開いた溝に地球ができて間もない頃から存在していたにも関わらず、その奇妙な物体は形を整えられたモノリスであり、その巨体は過去に、知的生物による細工を受け、そしておそらくは礼拝の対象だったに疑いないように思えた。", "恐怖で呆然とする一方、科学者や考古学者の喜びのような多少のスリルも感じながら、周囲をさらに詳細に調べてみた。月は今や天頂近く、谷間を囲む高い断崖の上を妖しく鮮やかに輝き、谷底に幅広い川が流れているのが分かった。川は湾曲しており上流も下流も見えない。そして水は、斜面に立つ足のところまで来ていた。谷の向こうでは、巨大なモノリスの土台も波に洗われている。モノリスの表面に文字や粗雑な彫刻が刻まれているのを見ることができた。碑文は象形文字で書かれていたが、私の知らないものであり、また、本で見たいかなるものとも違っていた。文字の大部分は、魚、鰻、蛸、甲殻類、軟体動物、鯨などの水棲動物を様式化していた。文字の中には、海底隆起によりできた平地で、腐敗した死骸を目にした他は、現代の世界では知られていない、海の生物を表しているらしいものもあった。", "特に目を引かれたのは、彫刻の絵柄の方だった。巨大なサイズのお陰で、間に川を挟んでもはっきりと見ることができたが、石の表面に浅浮き彫りの彫刻が並んでいた。そのモチーフは、画家のドレを嫉妬させるようなものだった。彫刻は人間、少なくともある種の人間を表しているようだった。ただ、その「人間」は、海底の洞窟で魚のように戯れ、波の下にあると思われるモノリスの祭壇を拝んでいるように見える。彼らの顔や姿を詳しく述べようとは思わない。思い出すだけで気が遠くなるからだ。ポーやブルワーのような作家の想像力も及ばないほど彼らはグロテスクだったが、忌々しいことに全体的な輪郭は人間によく似ていた。水かきのある手足、驚くほど大きくてたるんだ唇、ギョロッとしたガラスのような目玉、その他、思い出すのも気持ち悪い特徴にもかかわらずだ。奇妙なことに、「人間」とその背景の彫刻の大きさは、ひどくバランスを欠いているようだった。例えば、彼らの一人が鯨を殺している場面で、鯨は人間よりほんの少し大きいだけだ。今述べたとおり、彼らはグロテスクで異様に大きかった。しかしすぐに、それらは原始的な漁業・海洋民族がこしらえた想像上の神々だと思った。ピルトダウン人やネアンデルタール人が誕生する幾時代も前に絶滅した、何らかの種族によるものに違いない。最も大胆な人類学者さえ考えつかない過去の世界を思いもよらず垣間見て、畏敬の念に打たれた。考えこんで立ち尽くしていると、眼前を静かに流れる川に、月が奇妙な影を落とした。", "その時、突然、私はそれを見た。水面をわずかに波立たせて浮上してきたそいつは、暗い水面を出て、視界に滑りこんできた。ポリュフェマスのように忌まわしいその巨人は、悪夢に出てくる恐ろしい怪物のように、モノリスに向かって突進した。鱗の生えた巨大な腕をモノリスに巻き付けると、巨人は醜い頭を垂れて、ゆっくりした一定の声を発した。私はその時に狂ってしまったのだと思う。", "半狂乱で斜面と崖を登り、座礁したボートのところに錯乱しながら戻ったが、その時のことはほとんど覚えていない。多くの歌を歌い、歌えないときは奇妙な笑い声をあげたと思う。ボートに到着して間もなく、大きな嵐があったのをぼんやりと覚えている。少なくとも、雷鳴と、自然が最も荒れ狂った時にしか発しないような轟音を耳にしたと思う。", "気が付くと、サンフランシスコの病院にいた。アメリカ船の船長が、海の真ん中で私のボートを見つけ、病院まで運んでくれたのだ。錯乱しながら多くのことを話したが、ほとんど相手にされなかった。太平洋上で大地が隆起したことについて、救助してくれた人たちは何も知らなかった。それに、彼らが信じられないだろうことについて、あれこれ言っても意味がない。一度、著名な民俗学者を探し出し、魚神ダゴンに関する古代フェリシテ人の伝説について、相手に笑われるような風変わりな質問をしたことがある。しかしすぐ、彼が絶望的なまでに常識的であるのが分かり、質問をやめた。", "夜、とりわけ、欠け始めた月が満月と半月になる頃、あの巨人が見える。モルヒネを試してみたが、薬物によって得られたのは一時的な安らぎだけで、私は絶望的な奴隷のように薬から離れられなくなってしまった。だからもう、全てを終わらせるつもりだ。一部始終は書き終えた。同胞たちにとって何かの参考になるか、あるいは単に馬鹿にされ笑われるのかもしれない。よく自分自身に問いかける。あそこで見たのは、すべてではないにしろ、単なる幻だったのではないか？　ドイツ軍艦から逃げ出した後、遮るもののないボートで太陽にやられ、戯言をわめきながら見た幻覚ではなかったか？　こう自問すると、それに答えるように、恐ろしいイメージがいつも鮮明に浮かび上がる。深海のことを考えようとすると、あの名前もない生き物を思い出し身震いする。まさにこの瞬間にも、ぬるぬるした海底をじたばた這い回っているかもしれない。石でできた太古の偶像を崇め、水浸しの花崗岩でできた海底のオベリスクに、やつら自身の忌まわしい姿を刻んでいるのかもしれない。やつらが波から上がり、悪臭のするカギ爪でもって、戦争で疲弊した弱々しい人類の生き残りを引きずり下ろす日が見える。陸地が沈み、全世界が地獄絵と化すなか、暗黒の海底が隆起する日が見える。", "終わりは近い。ドアのところで音が聞こえる。何かぬめぬめした巨体が、ドアにぶつかっているような音だ。見つかりはすまい。神よ、あの手が！　窓に！　窓に！"];

  let current = 0;
  let jpVisible = false;
  // ページごとの欄外メモ(単語タップ履歴)。ページを離れても保持し、戻ったら復元する
  const marginNotesByPage = {};

  function cleanWord(raw) {
    return raw.replace(/[.,!?;:"'\u2018\u2019\u201c\u201d()]/g, '');
  }

  function renderPageText(text) {
    const container = document.getElementById('page-text');
    container.innerHTML = '';
    const words = text.split(/\s+/);
    words.forEach(function(w, i) {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w;
      const key = cleanWord(w).toLowerCase();
      span.dataset.word = key;
      span.addEventListener('click', function() {
        onWordTap(key, span);
      });
      container.appendChild(span);
      container.appendChild(document.createTextNode(' '));
    });
  }

  function renderMarginList() {
    const listEl = document.getElementById('margin-list');
    const notes = marginNotesByPage[current] || [];
    listEl.innerHTML = '';
    if (notes.length === 0) {
      listEl.innerHTML = '<div class="margin-empty">まだ何も書き込まれていない</div>';
      return;
    }
    notes.forEach(function(note) {
      const div = document.createElement('div');
      div.className = 'margin-note';
      div.style.setProperty('--tilt', (Math.random() * 1.6 - 0.8) + 'deg');
      if (note.loading) {
        div.innerHTML = '<span class="mn-word">' + note.word + '</span><span class="mn-loading">　調べています…</span>';
      } else {
        div.innerHTML = '<span class="mn-word">' + note.word + '</span><span class="mn-meaning">' + note.meaning + '</span>';
      }
      listEl.appendChild(div);
    });
    listEl.scrollTop = listEl.scrollHeight;
  }

  function markTappedWordsOnPage() {
    const notes = marginNotesByPage[current] || [];
    const tappedWords = new Set(notes.map(function(n) { return n.key; }));
    document.querySelectorAll('#page-text .word').forEach(function(span) {
      if (tappedWords.has(span.dataset.word)) span.classList.add('tapped');
      else span.classList.remove('tapped');
    });
  }

  function onWordTap(key, span) {
    if (!key) return;
    if (!marginNotesByPage[current]) marginNotesByPage[current] = [];
    // 既にこのページで調べた単語なら、重複追加しない
    if (marginNotesByPage[current].some(function(n) { return n.key === key; })) return;

    const note = { key: key, word: key, meaning: '', loading: true };
    marginNotesByPage[current].push(note);
    span.classList.add('tapped');
    renderMarginList();

    // 単語の意味の取得は次のステップで実装（今は仮のダミー表示）
    setTimeout(function() {
      note.loading = false;
      note.meaning = '（意味の自動取得は準備中）';
      renderMarginList();
    }, 400);
  }

  function render() {
    renderPageText(pagesEn[current]);
    document.getElementById('jp-text').textContent = pagesJp[current];
    document.getElementById('page-num').textContent = (current + 1) + " / " + pagesEn.length;
    document.getElementById('btn-prev').disabled = current === 0;
    document.getElementById('btn-next').disabled = current === pagesEn.length - 1;
    markTappedWordsOnPage();
    renderMarginList();
    document.querySelector('.page-scroll').scrollTop = 0;
  }

  document.getElementById('btn-prev').addEventListener('click', function() {
    if (current > 0) { current--; render(); }
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    if (current < pagesEn.length - 1) { current++; render(); }
  });
  document.getElementById('btn-toggle-jp').addEventListener('click', function() {
    jpVisible = !jpVisible;
    document.getElementById('jp-sheet').classList.toggle('show', jpVisible);
  });

  // ---------- 縦向き検知 ----------
  function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    document.body.classList.toggle('is-portrait', isPortrait);
  }
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);
  checkOrientation();

  render();
</script>
