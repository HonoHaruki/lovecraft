<title>DAGON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f0d;
    --paper: #e8dfc4;
    --ink: #2b2620;
    --accent: #a8863f;
    --margin-bg: #14140f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(ellipse 900px 700px at 50% -10%, rgba(60,50,25,0.10), transparent 60%),
      var(--bg);
    color: #d8d2c2;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }

  /* ---------- 縦向き案内 ---------- */
  #rotate-notice {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 999;
    flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 40px;
  }
  #rotate-notice .icon { font-size: 3rem; margin-bottom: 16px; }
  #rotate-notice h2 { color: var(--accent); font-family: Georgia, serif; letter-spacing: 2px; margin: 0 0 10px; }
  #rotate-notice p { color: #8a8370; font-size: 0.9rem; max-width: 320px; line-height: 1.6; }
  body.is-portrait #rotate-notice { display: flex; }
  body.is-portrait #app { display: none; }

  /* ---------- 全体レイアウト(横向き2分割) ---------- */
  #app {
    display: flex;
    height: 100%;
  }

  /* ---------- 左：本文ページ ---------- */
  .book-col {
    flex: 0 0 62%;
    max-width: 62%;
    display: flex; flex-direction: column;
    position: relative;
    border-right: 1px solid #221f16;
  }
  .book-header {
    position: relative;
    padding: calc(env(safe-area-inset-top) + 14px) 20px 8px;
    text-align: center;
    flex: none;
  }
  .book-header h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-weight: 600;
    letter-spacing: 6px;
    font-size: 1.25rem;
    color: var(--accent);
    margin: 0;
  }
  .book-header .subtitle { font-size: 0.65rem; color: #6b6656; letter-spacing: 2px; margin-top: 2px; }
  .font-size-controls {
    position: absolute;
    right: 16px;
    top: calc(env(safe-area-inset-top) + 14px);
    display: flex;
    gap: 6px;
  }
  .font-size-controls button {
    width: 30px; height: 26px;
    border: 1px solid #3a3527;
    background: none;
    color: #8a8370;
    border-radius: 4px;
    font-size: 0.72rem;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }

  .page {
    position: absolute;
    left: 25%; right: 25%;
    top: 28%;
    max-height: 44%; /* JS側で羊皮紙の安全域の高さに合わせて実測値を上書きする */
    height: auto;
    color: var(--ink);
    font-family: 'EB Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    font-size: var(--page-font-size, 1.05rem);
    letter-spacing: 0.2px;
    line-height: 1.75;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px 8px;
  }
  .page::first-letter {
    float: left;
    font-size: 3.1em;
    line-height: 0.78;
    padding: 4px 8px 0 0;
    color: var(--accent);
    font-family: Georgia, serif;
  }
  .page .word {
    cursor: pointer;
    border-bottom: 1px dotted transparent;
  }
  .page .word.highlighted {
    border-bottom: 1px dotted rgba(168,134,63,0.6);
  }
  .page .word.tapped {
    border-bottom: 1px solid var(--accent);
    color: #7a5a1e;
  }
  .page-loading-hint {
    position: absolute;
    top: 10px; right: 14px;
    font-size: 0.7rem;
    color: #8a8370;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    opacity: 0.8;
  }

  .book-footer {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
    position: relative;
    z-index: 10;
    background: var(--bg);
    border-top: 1px solid #221f16;
  }
  .book-footer button {
    flex: 1;
    background: #1a1d1a;
    color: var(--accent);
    border: 1px solid #3a3527;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
  }
  .book-footer button:disabled { opacity: 0.35; }
  .page-num { flex: none; color: #8a8370; font-size: 0.8rem; min-width: 56px; text-align: center; }
  .btn-jp-toggle {
    flex: none !important;
    background: none !important;
    border: 1px solid #3a3527 !important;
    color: var(--accent) !important;
    border-radius: 20px !important;
    padding: 10px 16px !important;
    font-size: 0.8rem !important;
  }

  /* ---------- 日本語訳: 本文カラムだけに重なるボトムシート ---------- */
  /* 高さは常に固定(中身の長さでは変わらない)。中身が長ければ#jp-textの中だけがスクロールする。
     高さの実際の値(半分/全画面)はJS側で実測してheightに直接設定する(dvhや%指定はブラウザ差で崩れるため) */
  .jp-sheet {
    position: absolute;
    left: 0; right: 0;
    bottom: var(--footer-h, 64px);
    height: 300px;
    background: #17190f;
    color: #b9b39c;
    border-top: 1px solid #3a3527;
    border-radius: 14px 14px 0 0;
    display: flex;
    flex-direction: column;
    font-size: 0.92rem;
    line-height: 1.85;
    transform: translateY(105%);
    transition: transform 0.25s ease, height 0.25s ease;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
    z-index: 5;
  }
  .jp-sheet.show { transform: translateY(0); }
  .jp-drag-handle {
    flex: none;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0 6px;
    cursor: grab;
    touch-action: none;
  }
  .jp-drag-handle span {
    width: 38px;
    height: 4px;
    border-radius: 2px;
    background: #4a4530;
  }
  .jp-sheet .jp-label {
    flex: none;
    padding: 0 24px 10px;
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .jp-sheet #jp-text {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 24px 22px;
  }
  .jp-commentary-toggle {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed #3a3527;
    color: var(--accent);
    font-size: 0.8rem;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .jp-commentary-body {
    margin-top: 10px;
    font-size: 0.88rem;
    line-height: 1.8;
  }
  .jp-commentary-body .jc-label {
    display: block;
    font-size: 0.68rem;
    color: #8a7a52;
    letter-spacing: 2px;
    margin: 12px 0 4px;
  }
  .jp-commentary-body .jc-label:first-child { margin-top: 0; }
  .jp-commentary-body .jc-loading,
  .jp-commentary-body .jc-error {
    font-style: italic;
    color: #8a7a52;
    font-size: 0.85rem;
  }
  .jp-commentary-body .jc-error { color: #a05a4a; cursor: pointer; }
  .jc-sentence {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 6px;
    background: rgba(255,255,255,0.03);
  }
  .jc-sentence-num {
    display: inline-block;
    font-size: 0.68rem;
    color: #6b6656;
    margin-bottom: 4px;
  }
  .jc-sentence-en {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic;
    color: var(--accent);
    font-size: 0.95rem;
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .jc-sentence-row { margin-top: 4px; font-size: 0.85rem; }
  .jc-sentence-tag {
    display: inline-block;
    font-size: 0.66rem;
    color: #8a7a52;
    border: 1px solid #3a3527;
    border-radius: 3px;
    padding: 1px 5px;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* ---------- 右：欄外メモ(単語帳) ---------- */
  .margin-col {
    flex: 1;
    background: var(--margin-bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .margin-header {
    flex: none;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 10px;
    border-bottom: 1px dashed #2c2a1c;
  }
  .margin-header-row {
    display: flex;

<script>
  const pagesEn = ["I am writing this under an appreciable mental strain, since by tonight I shall be no more. Penniless, and at the end of my supply of the drug which alone, makes life endurable, I can bear the torture no longer; and shall cast myself from this garret window into the squalid street below. Do not think from my slavery to morphine that I am a weakling or a degenerate. When you have read these hastily scrawled pages you may guess, though never fully realise, why it is that I must have forgetfulness or death.", "It was in one of the most open and least frequented parts of the broad Pacific that the packet of which I was supercargo fell a victim to the German sea-raider. The great war was then at its very beginning, and the ocean forces of the Hun had not completely sunk to their later degradation; so that our vessel was made a legitimate prize, whilst we of her crew were treated with all the fairness and consideration due us as naval prisoners. So liberal, indeed, was the discipline of our captors, that five days after we were taken I managed to escape alone in a small boat with water and provisions for a good length of time.", "When I finally found myself adrift and free, I had but little idea of my surroundings. Never a competent navigator, I could only guess vaguely by the sun and stars that I was somewhat south of the equator. Of the longitude I knew nothing, and no island or coastline was in sight. The weather kept fair, and for uncounted days I drifted aimlessly beneath the scorching sun; waiting either for some passing ship, or to be cast on the shores of some habitable land. But neither ship nor land appeared, and I began to despair in my solitude upon the heaving vastness of unbroken blue.", "The change happened whilst I slept. Its details I shall never know; for my slumber, though troubled and dream-infested, was continuous. When at last I awakened, it was to discover myself half sucked into a slimy expanse of hellish black mire which extended about me in monotonous undulations as far as I could see, and in which my boat lay grounded some distance away.", "Though one might well imagine that my first sensation would be of wonder at so prodigious and unexpected a transformation of scenery, I was in reality more horrified than astonished; for there was in the air and in the rotting soil a sinister quality which chilled me to the very core. The region was putrid with the carcasses of decaying fish, and of other less describable things which I saw protruding from the nasty mud of the unending plain. Perhaps I should not hope to convey in mere words the unutterable hideousness that can dwell in absolute silence and barren immensity. There was nothing within hearing, and nothing in sight save a vast reach of black slime; yet the very completeness of the stillness and the homogeneity of the landscape oppressed me with a nauseating fear.", "The sun was blazing down from a sky which seemed to me almost black in its cloudless cruelty; as though reflecting the inky marsh beneath my feet. As I crawled into the stranded boat I realised that only one theory could explain my position. Through some unprecedented volcanic upheaval, a portion of the ocean floor must have been thrown to the surface, exposing regions which for innumerable millions of years had lain hidden under unfathomable watery depths. So great was the extent of the new land which had risen beneath me, that I could not detect the faintest noise of the surging ocean, strain my ears as I might. Nor were there any sea-fowl to prey upon the dead things.", "For several hours I sat thinking or brooding in the boat, which lay upon its side and afforded a slight shade as the sun moved across the heavens. As the day progressed, the ground lost some of its stickiness, and seemed likely to dry sufficiently for travelling purposes in a short time. That night I slept but little, and the next day I made for myself a pack containing food and water, preparatory to an overland journey in search of the vanished sea and possible rescue.", "On the third morning I found the soil dry enough to walk upon with ease. The odour of the fish was maddening; but I was too much concerned with graver things to mind so slight an evil, and set out boldly for an unknown goal. All day I forged steadily westward, guided by a far-away hummock which rose higher than any other elevation on the rolling desert. That night I encamped, and on the following day still travelled toward the hummock, though that object seemed scarcely nearer than when I had first espied it. By the fourth evening I attained the base of the mound, which turned out to be much higher than it had appeared from a distance, an intervening valley setting it out in sharper relief from the general surface. Too weary to ascend, I slept in the shadow of the hill.", "I know not why my dreams were so wild that night; but ere the waning and fantastically gibbous moon had risen far above the eastern plain, I was awake in a cold perspiration, determined to sleep no more. Such visions as I had experienced were too much for me to endure again. And in the glow of the moon I saw how unwise I had been to travel by day. Without the glare of the parching sun, my journey would have cost me less energy; indeed, I now felt quite able to perform the ascent which had deterred me at sunset. Picking up my pack, I started for the crest of the eminence.", "I have said that the unbroken monotony of the rolling plain was a source of vague horror to me; but I think my horror was greater when I gained the summit of the mound and looked down the other side into an immeasurable pit or canyon, whose black recesses the moon had not yet soared high enough to illumine. I felt myself on the edge of the world, peering over the rim into a fathomless chaos of eternal night. Through my terror ran curious reminiscences of Paradise Lost, and Satan's hideous climb through the unfashioned realms of darkness.", "As the moon climbed higher in the sky, I began to see that the slopes of the valley were not quite so perpendicular as I had imagined. Ledges and outcroppings of rock afforded fairly easy footholds for a descent, whilst after a drop of a few hundred feet, the declivity became very gradual. Urged on by an impulse which I cannot definitely analyse, I scrambled with difficulty down the rocks and stood on the gentler slope beneath, gazing into the Stygian deeps where no light had yet penetrated.", "All at once my attention was captured by a vast and singular object on the opposite slope, which rose steeply about a hundred yards ahead of me; an object that gleamed whitely in the newly bestowed rays of the ascending moon. That it was merely a gigantic piece of stone, I soon assured myself; but I was conscious of a distinct impression that its contour and position were not altogether the work of Nature. A closer scrutiny filled me with sensations I cannot express; for despite its enormous magnitude, and its position in an abyss which had yawned at the bottom of the sea since the world was young, I perceived beyond a doubt that the strange object was a well-shaped monolith whose massive bulk had known the workmanship and perhaps the worship of living and thinking creatures.", "Dazed and frightened, yet not without a certain thrill of the scientist's or archaeologist's delight, I examined my surroundings more closely. The moon, now near the zenith, shone weirdly and vividly above the towering steeps that hemmed in the chasm, and revealed the fact that a far-flung body of water flowed at the bottom, winding out of sight in both directions, and almost lapping my feet as I stood on the slope. Across the chasm, the wavelets washed the base of the Cyclopean monolith, on whose surface I could now trace both inscriptions and crude sculptures. The writing was in a system of hieroglyphics unknown to me, and unlike anything I had ever seen in books, consisting for the most part of conventionalised aquatic symbols such as fishes, eels, octopi, crustaceans, molluscs, whales and the like. Several characters obviously represented marine things which are unknown to the modern world, but whose decomposing forms I had observed on the ocean-risen plain.", "It was the pictorial carving, however, that did most to hold me spellbound. Plainly visible across the intervening water on account of their enormous size was an array of bas-reliefs whose subjects would have excited the envy of a Dore. I think that these things were supposed to depict men -- at least, a certain sort of men; though the creatures were shown disporting like fishes in the waters of some marine grotto, or paying homage at some monolithic shrine which appeared to be under the waves as well. Of their faces and forms I dare not speak in detail, for the mere remembrance makes me grow faint. Grotesque beyond the imagination of a Poe or a Bulwer, they were damnably human in general outline despite webbed hands and feet, shockingly wide and flabby lips, glassy, bulging eyes, and other features less pleasant to recall. Curiously enough, they seemed to have been chiselled badly out of proportion with their scenic background; for one of the creatures was shown in the act of killing a whale represented as but little larger than himself. I remarked, as I say, their grotesqueness and strange size; but in a moment decided that they were merely the imaginary gods of some primitive fishing or seafaring tribe; some tribe whose last descendant had perished eras before the first ancestor of the Piltdown or Neanderthal Man was born. Awestruck at this unexpected glimpse into a past beyond the conception of the most daring anthropologist, I stood musing whilst the moon cast queer reflections on the silent channel before me.", "Then suddenly I saw it. With only a slight churning to mark its rise to the surface, the thing slid into view above the dark waters. Vast, Polyphemus-like, and loathsome, it darted like a stupendous monster of nightmares to the monolith, about which it flung its gigantic scaly arms, the while it bowed its hideous head and gave vent to certain measured sounds. I think I went mad then.", "Of my frantic ascent of the slope and cliff, and of my delirious journey back to the stranded boat, I remember little. I believe I sang a great deal, and laughed oddly when I was unable to sing. I have indistinct recollections of a great storm some time after I reached the boat; at any rate, I knew that I heard peals of thunder and other tones which Nature utters only in her wildest moods.", "When I came out of the shadows I was in a San Francisco hospital; brought thither by the captain of the American ship which had picked up my boat in mid-ocean. In my delirium I had said much, but found that my words had been given scant attention. Of any land upheaval in the Pacific, my rescuers knew nothing; nor did I deem it necessary to insist upon a thing which I knew they could not believe. Once I sought out a celebrated ethnologist, and amused him with peculiar questions regarding the ancient Philistine legend of Dagon, the Fish-God; but soon perceiving that he was hopelessly conventional, I did not press my inquiries.", "It is at night, especially when the moon is gibbous and waning, that I see the thing. I tried morphine; but the drug has given only transient surcease, and has drawn me into its clutches as a hopeless slave. So now I am to end it all, having written a full account for the information or the contemptuous amusement of my fellow-men. Often I ask myself if it could not all have been a pure phantasm -- a mere freak of fever as I lay sun-stricken and raving in the open boat after my escape from the German man-of-war. This I ask myself, but ever does there come before me a hideously vivid vision in reply. I cannot think of the deep sea without shuddering at the nameless things that may at this very moment be crawling and floundering on its slimy bed, worshipping their ancient stone idols and carving their own detestable likenesses on submarine obelisks of water-soaked granite. I dream of a day when they may rise above the billows to drag down in their reeking talons the remnants of puny, war-exhausted mankind -- of a day when the land shall sink, and the dark ocean floor shall ascend amidst universal pandemonium.", "The end is near. I hear a noise at the door, as of some immense slippery body lumbering against it. It shall not find me. God, that hand! The window! The window!"];
  const pagesJp = ["かなりのストレスを感じながら、これを書いている。今夜にはもう、生きていないだろう。金も、頼みの綱のクスリも尽きた。これ以上、苦しみには耐えられない。この屋根裏の窓から、下のうす汚い通りに、身を投げることにしよう。モルヒネ中毒が原因で、身体が弱り、精神も堕落したのだと考えないでほしい。乱雑に走り書いたこの文章を読んでもらえば、完全に理解するのは無理にしても、一体全体なぜ私が忘却や死を望んでいるのか、見当はつくと思う。", "船荷監督として乗船していた定期船がドイツの襲撃艇に捕らえられたのは、広い太平洋のなかでも一段と広々として、船の往来がめったにない海域だった。大戦は始まったばかりで、ドイツ人どもの海軍も、後のように落ちぶれきってはいなかった。船は合法的な戦利品にされたといえ、乗組員は海軍の捕虜として、相応の公正さと配慮をもって扱われた。やつらの軍規が実に大らかだったおかげで、拿捕されてから五日後、小さなボートに長期間もつだけの水と食料を積み、ひとり逃げおおすことができた。", "ようやく自由に、そして漂流する身となったが、自分がどこにいるのか、まったく分からない。優れた航海士ではなかったので、太陽と星の位置から、赤道のやや南にいるとなんとなく推測するしかできなかった。緯度についてはまったく分からず、島や海岸線はどこにも見えない。晴れた日がつづき、焼けつくような太陽の下、何日もあてどなく漂流した。通りすがりの船か、人が住める陸地の岸に打ち上げられるのを待っていた。しかし船も陸地も見えてこず、果てしない海の広大なうねりの中に孤立している状態に絶望を感じ始めた。", "状況が変わったのは、寝ている間だった。何が起きたか、詳しくはわからない。というのも、夢にうなされ、よく眠れなかったとはいえ、ずっとまどろんでいたからだ。ようやく目が覚めると、真っ黒な泥のネバネバしたなかに半身が飲み込まれていた。見渡すかぎり、そのぬかるみは単調な起伏としてまわりに広がっていた。少し離れたところに、ボートが乗り上げていた。", "けたはずれの、予想もつかない風景の変化に、まずは驚いたのだろうと思われるかもしれない。しかし、本当のところ、驚きよりも恐怖の方が大きかった。まわりの空気や腐った泥に不吉な気配があって、体の芯まで凍るようだった。辺りにはひどい悪臭が漂っており、腐った死魚や、見たところなんとも言いようのないものの死骸が、果てしなく広がる不潔な泥の平原から突き出ている。完全な静けさの中、不毛な無限の空間に宿る言いようのない恐ろしさは、ひょっとすると言葉だけでは伝わらないかもしれない。何も聞こえず、一面に広がる黒い泥の他は何も見えない。それでも、あたりの静けさが完全なことと、風景が単調なこと、まさにそれらが心に重くのしかかり、吐き気を起こさせるような恐怖を覚えた。", "太陽はぎらぎらと照り、雲ひとつない無慈悲な空は黒いと言ってもよく、あたかも足元の真っ黒な沼地を映すかのようだった。座礁したボートに這うように入り込みながら、この状況を説明する理屈はたった一つしかないと気づいた。火山がかつてない規模で隆起したことで、海底の一部が水面に持ち上がり、底知れぬ深海に何百万年も隠れていた領域が現れたに違いない。足元に現れた新しい土地はだだっ広く、いくら耳を澄ませても、かすか波音さえ聞こえない。そしてまた、死骸をあさる海鳥もいない。", "数時間、ボートの中で考え、思い悩んだ。ボートは側面を下に横たわっており、太陽が空を動くにつれ、わずかな日陰をつくってくれた。時間が経つと、地面のねばつきは少なくなった。もう少しすれば、歩いて動くのに十分なほど乾くように思えた。その夜は、ほとんど眠れなかった。翌日、食料と水をまとめた。消え失せた海と救援の可能性を求めて、陸路を行く準備である。", "三日目の朝、地面は簡単に歩けるほど乾いていた。魚の腐臭はひどかったが、もっと重要なことに関心があったので、そんなささいなことは気にならなかった。そして未知の目標に向け、大胆に出発した。一日中、西へ向かってゆっくり進んで行った。なだらかに起伏する荒れ地の遠くにある、他のところより盛り上がっている丘を目標にした。その夜は野営し、次の日も同じ丘に向けて歩いた。しかし、最初にその丘を見つけた時と比べ、まったく近づいていないようだった。四日目の夕方、丘のふもとにたどり着いた。遠くから見た時より丘はずっと高い。谷があるせいで、周りの平地とくらべて丘の起伏がくっきり分かる。登るには疲れすぎていたので、丘の陰で眠った。", "なぜかは分からないが、その夜は狂気じみた夢を見た。欠け始めの、幻想的な形の月が東の平原に高く昇る前に、冷たい汗をかいて目を覚まし、もう眠らないことに決めた。さっきの夢をもう一度見るのは、とても耐えられないからだ。月の光を浴びながら、日中に歩いてきたのは馬鹿なことをしたと思った。灼熱の太陽がなかったら、歩くのはもっと楽だった。実際、日没時には躊躇したが、今なら丘に登ることができそうな気がした。荷物をまとめ、丘の頂上を目指して出発した。", "起伏する平原の途切れない単調さのせいで、言いようのない恐怖を感じることは以前に書いた。しかし、頂上に着いて丘の反対側にある限りなく深い峡谷を見下ろした時の恐怖はさらにひどいものだった。月はまだ低く、暗い峡谷の奥まで照らしてはいない。まるで自分が世界の果てに立ち、その縁から、永遠に終わらない夜の、底なしの混沌を覗きこんでいるように感じられた。奇妙なことに、恐怖を感じながら、『失楽園』と、形のない闇の国から登ってくる恐ろしい魔王の姿とが、心に浮かんだ。", "月が空高く昇るにつれ、谷の傾斜は思ったより切り立っていないことが分かってきた。岩棚や露出した石が下っていくのに最適な足場になっていて、数百フィートの急な下りを過ぎれば、坂は穏やかになっているようだった。不可解な衝動に駆られ、苦労しながら岩をはい降り、その下のゆるやかな坂に立った。そして、未だ光が射したことのない真っ暗な底を覗きこんだ。", "ふと注意を引かれたのは、前方およそ一〇〇ヤードのところにそそり立つ、向かいの斜面にある大きくて奇妙な物体だった。それは、高度を増す月の光に照らされて、白く輝いていた。巨大な岩石であることは、すぐに分かった。しかし、その形や位置が自然の力だけによるのではないという印象も強く受けた。さらによく見ているうちに、言いようのない感覚を覚えた。途方もなく大きく、海底にぽっかり開いた溝に地球ができて間もない頃から存在していたにも関わらず、その奇妙な物体は形を整えられたモノリスであり、その巨体は過去に、知的生物による細工を受け、そしておそらくは礼拝の対象だったに疑いないように思えた。", "恐怖で呆然とする一方、科学者や考古学者の喜びのような多少のスリルも感じながら、周囲をさらに詳細に調べてみた。月は今や天頂近く、谷間を囲む高い断崖の上を妖しく鮮やかに輝き、谷底に幅広い川が流れているのが分かった。川は湾曲しており上流も下流も見えない。そして水は、斜面に立つ足のところまで来ていた。谷の向こうでは、巨大なモノリスの土台も波に洗われている。モノリスの表面に文字や粗雑な彫刻が刻まれているのを見ることができた。碑文は象形文字で書かれていたが、私の知らないものであり、また、本で見たいかなるものとも違っていた。文字の大部分は、魚、鰻、蛸、甲殻類、軟体動物、鯨などの水棲動物を様式化していた。文字の中には、海底隆起によりできた平地で、腐敗した死骸を目にした他は、現代の世界では知られていない、海の生物を表しているらしいものもあった。", "特に目を引かれたのは、彫刻の絵柄の方だった。巨大なサイズのお陰で、間に川を挟んでもはっきりと見ることができたが、石の表面に浅浮き彫りの彫刻が並んでいた。そのモチーフは、画家のドレを嫉妬させるようなものだった。彫刻は人間、少なくともある種の人間を表しているようだった。ただ、その「人間」は、海底の洞窟で魚のように戯れ、波の下にあると思われるモノリスの祭壇を拝んでいるように見える。彼らの顔や姿を詳しく述べようとは思わない。思い出すだけで気が遠くなるからだ。ポーやブルワーのような作家の想像力も及ばないほど彼らはグロテスクだったが、忌々しいことに全体的な輪郭は人間によく似ていた。水かきのある手足、驚くほど大きくてたるんだ唇、ギョロッとしたガラスのような目玉、その他、思い出すのも気持ち悪い特徴にもかかわらずだ。奇妙なことに、「人間」とその背景の彫刻の大きさは、ひどくバランスを欠いているようだった。例えば、彼らの一人が鯨を殺している場面で、鯨は人間よりほんの少し大きいだけだ。今述べたとおり、彼らはグロテスクで異様に大きかった。しかしすぐに、それらは原始的な漁業・海洋民族がこしらえた想像上の神々だと思った。ピルトダウン人やネアンデルタール人が誕生する幾時代も前に絶滅した、何らかの種族によるものに違いない。最も大胆な人類学者さえ考えつかない過去の世界を思いもよらず垣間見て、畏敬の念に打たれた。考えこんで立ち尽くしていると、眼前を静かに流れる川に、月が奇妙な影を落とした。", "その時、突然、私はそれを見た。水面をわずかに波立たせて浮上してきたそいつは、暗い水面を出て、視界に滑りこんできた。ポリュフェマスのように忌まわしいその巨人は、悪夢に出てくる恐ろしい怪物のように、モノリスに向かって突進した。鱗の生えた巨大な腕をモノリスに巻き付けると、巨人は醜い頭を垂れて、ゆっくりした一定の声を発した。私はその時に狂ってしまったのだと思う。", "半狂乱で斜面と崖を登り、座礁したボートのところに錯乱しながら戻ったが、その時のことはほとんど覚えていない。多くの歌を歌い、歌えないときは奇妙な笑い声をあげたと思う。ボートに到着して間もなく、大きな嵐があったのをぼんやりと覚えている。少なくとも、雷鳴と、自然が最も荒れ狂った時にしか発しないような轟音を耳にしたと思う。", "気が付くと、サンフランシスコの病院にいた。アメリカ船の船長が、海の真ん中で私のボートを見つけ、病院まで運んでくれたのだ。錯乱しながら多くのことを話したが、ほとんど相手にされなかった。太平洋上で大地が隆起したことについて、救助してくれた人たちは何も知らなかった。それに、彼らが信じられないだろうことについて、あれこれ言っても意味がない。一度、著名な民俗学者を探し出し、魚神ダゴンに関する古代フェリシテ人の伝説について、相手に笑われるような風変わりな質問をしたことがある。しかしすぐ、彼が絶望的なまでに常識的であるのが分かり、質問をやめた。", "夜、とりわけ、欠け始めた月が満月と半月になる頃、あの巨人が見える。モルヒネを試してみたが、薬物によって得られたのは一時的な安らぎだけで、私は絶望的な奴隷のように薬から離れられなくなってしまった。だからもう、全てを終わらせるつもりだ。一部始終は書き終えた。同胞たちにとって何かの参考になるか、あるいは単に馬鹿にされ笑われるのかもしれない。よく自分自身に問いかける。あそこで見たのは、すべてではないにしろ、単なる幻だったのではないか？　ドイツ軍艦から逃げ出した後、遮るもののないボートで太陽にやられ、戯言をわめきながら見た幻覚ではなかったか？　こう自問すると、それに答えるように、恐ろしいイメージがいつも鮮明に浮かび上がる。深海のことを考えようとすると、あの名前もない生き物を思い出し身震いする。まさにこの瞬間にも、ぬるぬるした海底をじたばた這い回っているかもしれない。石でできた太古の偶像を崇め、水浸しの花崗岩でできた海底のオベリスクに、やつら自身の忌まわしい姿を刻んでいるのかもしれない。やつらが波から上がり、悪臭のするカギ爪でもって、戦争で疲弊した弱々しい人類の生き残りを引きずり下ろす日が見える。陸地が沈み、全世界が地獄絵と化すなか、暗黒の海底が隆起する日が見える。", "終わりは近い。ドアのところで音が聞こえる。何かぬめぬめした巨体が、ドアにぶつかっているような音だ。見つかりはすまい。神よ、あの手が！　窓に！　窓に！"];

  // ---------- APIキー管理 ----------
  function getApiKey() {
    return localStorage.getItem('lovecraft_gemini_key') || '';
  }
  function setApiKey(key) {
    localStorage.setItem('lovecraft_gemini_key', key);
    updateSettingsButtonState();

  // ---------- Gemini API 共通呼び出し ----------
  // モデル名はGoogle側の世代交代が早いため、エラーが出た場合はエラーメッセージが
  // 指定してくるモデル名にこの1箇所を書き換えれば全体に反映される
  const GEMINI_MODEL = 'gemini-3.7-flash';
  async function callGemini(promptText) {
    const apiKey = getApiKey();
    const controller = new AbortController();
    // 通信が固まったまま戻ってこない事態を避けるため、20秒でタイムアウトさせる
    const timeoutId = setTimeout(function() { controller.abort(); }, 20000);
    let res;
    try {
      res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-goog-api-key': apiKey
        },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] }),
        signal: controller.signal
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw new Error('タイムアウト(20秒)');
      throw e;
    } finally {
      clearTimeout(timeoutId);
    }
    if (!res.ok) {
      const errBody = await res.text().catch(function() { return ''; });
      console.warn('Gemini APIエラー本文:', errBody);
      throw new Error('HTTP ' + res.status);
    }
    const data = await res.json();
    const text = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
      data.candidates[0].content.parts[0].text;
    if (!text || !text.trim()) throw new Error('空の応答');
    return text.trim();
  }

  function getMeaningFromCache(pageIndex, word) {
    const cache = loadMeaningCache();
    return cache[pageIndex + ':' + word];

  // 該当ページの本文からトークン列(小文字・記号除去)を作る
  function tokenizeForMatch(text) {
    return text.split(/\s+/).map(function(w) { return cleanWord(w).toLowerCase(); });
  }

  // AIが返した語句(parts配列)を、そのページのトークン列上の位置に紐付ける
  // parts が複数ある場合は、文中で離れた位置に出現する「飛び飛びの熟語・構文」として扱う
  function buildHighlightGroups(pageIndex, items) {
    const tokens = tokenizeForMatch(pagesEn[pageIndex]);
    const groups = [];
    const indexMap = {}; // tokenIndex -> groupIdx (先勝ち)

    function findRange(partTokens, searchFrom) {
      for (let i = searchFrom; i <= tokens.length - partTokens.length; i++) {
        let match = true;
        for (let j = 0; j < partTokens.length; j++) {
          if (tokens[i + j] !== partTokens[j]) { match = false; break; }
        }
        if (match) return { start: i, end: i + partTokens.length - 1 };
      }
      return null;
    }

    (items || []).forEach(function(item) {
      if (!item || !item.parts || !item.parts.length) return;
      const ranges = [];
      let searchFrom = 0;
      for (let p = 0; p < item.parts.length; p++) {
        const partTokens = tokenizeForMatch(item.parts[p]).filter(Boolean);
        if (partTokens.length === 0) continue;
        const r = findRange(partTokens, searchFrom);
        if (!r) { ranges.length = 0; break; } // どこかのパーツが本文に見つからなければ、AIの誤りとして無視
        ranges.push(r);
        searchFrom = r.end + 1;
      }
      if (ranges.length === 0) return;
      // 既にどこかのトークンが別のグループに属していれば重複登録しない
      const overlap = ranges.some(function(r) {
        for (let i = r.start; i <= r.end; i++) { if (indexMap[i] !== undefined) return true; }
        return false;
      });
      if (overlap) return;

      const groupIdx = groups.length;
      groups.push({
        ranges: ranges,
        general: item.meaningGeneral || '',
        contextual: item.meaningContextual || '',
        pos: item.partOfSpeech || '',
        pronunciation: item.pronunciation || ''
      });
      ranges.forEach(function(r) {
        for (let i = r.start; i <= r.end; i++) { indexMap[i] = groupIdx; }
      });
    });

    return { groups: groups, indexMap: indexMap };
  }

  async function ensureHighlightsForPage(pageIndex) {
    if (pageHighlightsByPage[pageIndex]) return; // 既に取得済み(メモリ上)
    const cache = loadPageHighlightCache();
    if (cache[pageIndex]) {
      const built = buildHighlightGroups(pageIndex, cache[pageIndex]);
      pageHighlightsByPage[pageIndex] = built.groups;
      pageHighlightIndexByPage[pageIndex] = built.indexMap;
      if (pageIndex === current) applyHighlightsToDom();
      return;
    }
    const apiKey = getApiKey();
    if (!apiKey) return; // キー未設定の間はハイライトなし(全て通常表示)

    const paragraphEn = pagesEn[pageIndex];
    const prompt = 'あなたは英語学習者向けの一節から、辞書で調べる価値がある語句を選ぶ役目です。' +
      '以下の英文から、日本の高校〜大学レベルの学習者にとって知らない可能性が高い単語・熟語・句動詞・慣用句・構文を、' +
      '文章中に実際に登場する綴りのまま15〜20個ほど選んでください。基本的すぎる単語(the, is, and, have 等)は含めないでください。\n\n' +
      '単語だけでなく、以下のようなタイプも積極的に拾ってください。\n' +
      '・文中でひとまとまりの意味を持つ熟語・慣用句・句動詞(例: cast myself, no longer)\n' +
      '・"not so much A as B" や "the 比較級 A, the 比較級 B" のように、Aの部分とBの部分が文中で離れた位置にある構文(飛び飛びの語句)。この場合はAとBそれぞれの原文表記を"parts"に順番通り2つ入れてください。\n\n' +
      '英文: ' + paragraphEn + '\n\n' +
      '選んだ語句それぞれについて、以下の情報も付けてください。\n' +
      '・partOfSpeech: 単語の場合は実際の品詞(名詞/動詞/形容詞/副詞/前置詞など)、熟語・句動詞・構文の場合はその種別(熟語/句動詞/慣用句/構文)\n' +
      '・pronunciation: 単語の場合は発音記号(IPA、例: /dɪˈdʒɛnərət/)。熟語・構文などで発音記号が馴染まない場合は空文字でよい\n' +
      '・meaningGeneral: 一般的な辞書に載っているような、文脈に依存しない簡潔な訳語（15字以内、説明的な文章にしない）\n' +
      '・meaningContextual: この文章の中でその語句がどう使われているか、雰囲気や感情のニュアンスも込めて生き生きと(25〜45字程度で)\n\n' +
      '出力は次のJSON配列の形式のみとし、前置き・コードブロック記号は付けないでください。\n' +
      '[{"parts":["原文での表記そのまま"],"partOfSpeech":"...","pronunciation":"...","meaningGeneral":"...","meaningContextual":"..."}]\n' +
      '(飛び飛びの構文の場合はpartsに["Aの原文表記","Bの原文表記"]のように2つ入れてください)';

    try {
      const data = await callGemini(prompt);
      let jsonStr = data.trim().replace(/```json/gi, '').replace(/```/g, '').trim();
      const items = JSON.parse(jsonStr);
      savePageHighlightCache(pageIndex, items);
      const built = buildHighlightGroups(pageIndex, items);
      pageHighlightsByPage[pageIndex] = built.groups;
      pageHighlightIndexByPage[pageIndex] = built.indexMap;
      if (pageIndex === current) applyHighlightsToDom();
    } catch (e) {
      console.warn('ページのハイライト取得に失敗:', e);
      // 失敗時は空として扱い、無限リトライしないようにする
      pageHighlightsByPage[pageIndex] = [];
      pageHighlightIndexByPage[pageIndex] = {};
    }
  }

  function applyHighlightsToDom() {
    const groups = pageHighlightsByPage[current] || [];
    currentSpans.forEach(function(span) { span.classList.remove('highlighted'); });
    groups.forEach(function(group) {
      group.ranges.forEach(function(r) {
        for (let i = r.start; i <= r.end && i < currentSpans.length; i++) {
          currentSpans[i].classList.add('highlighted');
        }
      });
    });
  }

    const container = document.getElementById('page-text');
    container.innerHTML = '';
    const words = text.split(/\s+/);
    currentTokens = [];
    currentSpans = [];
    words.forEach(function(w, i) {

      span.className = 'word';

      span.addEventListener('click', function() {
        openWordSheet(i);

  function renderMarginList() {
    const listEl = document.getElementById('margin-list');
    const notes = marginNotesByPage[current] || [];
    listEl.innerHTML = '';
    if (notes.length === 0) {
      listEl.innerHTML = '<div class="margin-empty">――まだ何も記されていない。</div>';
      return;
    }
    notes.forEach(function(note) {
      const div = document.createElement('div');
      div.className = 'margin-note';
      div.style.setProperty('--tilt', (Math.random() * 1.6 - 0.8) + 'deg');
      const phoneticLine = (note.pronunciation || note.pos)
        ? '<span class="mn-phonetic">' + [note.pronunciation, note.pos].filter(Boolean).join('　・　') + '</span>' : '';
      if (note._repairing) {
        div.innerHTML = '<span class="mn-word">' + note.word + '</span>' + phoneticLine +
          '<span class="mn-block mn-loading">意味を辿っています…</span>';
      } else if (!note.general && !note.contextual || (note.contextual && note.contextual.indexOf('APIキー未設定') !== -1)) {
        // 過去のバージョンで意味が空、またはAPIキー未設定の案内文が意味として保存されてしまったメモを、タップで取得し直せるようにする
        div.innerHTML = '<span class="mn-word">' + note.word + '</span>' + phoneticLine +
          '<span class="mn-block mn-error-text">意味を取得できていません（タップで再取得）</span>';
        div.querySelector('.mn-error-text').addEventListener('click', function() {
          repairMarginNote(note);
        });
      } else {
        div.innerHTML = '<span class="mn-word">' + note.word + '</span>' + phoneticLine +
          (note.general ? '<span class="mn-block"><span class="mn-label">辞書的には</span><span class="mn-general">' + note.general + '</span></span>' : '') +
          (note.contextual ? '<span class="mn-block"><span class="mn-label">この場面では</span><span class="mn-contextual">' + note.contextual + '</span></span>' : '');
      }
      listEl.appendChild(div);
    });
    listEl.scrollTop = listEl.scrollHeight;
  }

  // 過去のバージョンなどで意味が空のまま保存されてしまったメモを、その場で取得し直す
  async function repairMarginNote(note) {
    const apiKey = getApiKey();
    if (!apiKey) return;
    note._repairing = true;
    renderMarginList();

    const paragraphEn = pagesEn[note.pageIndex];
    const paragraphJp = pagesJp[note.pageIndex];
    const prompt = 'あなたは英語小説を読む学習者を助ける辞書です。以下の英文の一節の中の「' + note.word + '」という語句について日本語で説明してください。' +
      'これが熟語・句動詞・慣用句・離れた位置にある構文である場合は、その旨も踏まえてください。\n\n' +
      '英文: ' + paragraphEn + '\n\n' +
      '参考(日本語訳): ' + paragraphJp + '\n\n' +
      '対象の語句: ' + note.word + '\n\n' +
      '出力は次のJSON形式のみとし、前置き・コードブロック記号は付けないでください。\n' +
      '{"partOfSpeech":"単語なら実際の品詞(名詞/動詞/形容詞など)、熟語等ならその種別(熟語/句動詞/慣用句/構文)",' +
      '"pronunciation":"単語なら発音記号(IPA)。熟語等で馴染まなければ空文字",' +
      '"meaningGeneral":"一般的な辞書のような、文脈に依存しない簡潔な訳語(15字以内)",' +
      '"meaningContextual":"この文中での使われ方を、雰囲気や感情のニュアンスも込めて生き生きと(25〜45字程度)"}';

    try {
      const raw = await callGemini(prompt);
      const jsonStr = raw.trim().replace(/```json/gi, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(jsonStr);
      const general = (parsed.meaningGeneral || '').trim();
      const contextual = (parsed.meaningContextual || '').trim();
      if (!general && !contextual) throw new Error('空の応答');
      note.general = general;
      note.contextual = contextual;
      note.pos = (parsed.partOfSpeech || '').trim();
      note.pronunciation = (parsed.pronunciation || '').trim();
      saveMeaningToCache(note.pageIndex, note.key, { general: note.general, contextual: note.contextual, pos: note.pos, pronunciation: note.pronunciation });
      saveMarginNotesToStorage();
    } catch (e) {
      console.warn('メモの再取得に失敗:', e);
    }
    note._repairing = false;
    renderMarginList();

  function markTappedWordsOnPage() {
    const notes = marginNotesByPage[current] || [];
    currentSpans.forEach(function(span) { span.classList.remove('tapped'); });
    notes.forEach(function(note) {
      (note.ranges || []).forEach(function(r) {
        for (let i = r.start; i <= r.end && i < currentSpans.length; i++) {
          currentSpans[i].classList.add('tapped');
        }
      });
    });
  }

  // ---------- 単語選択シート ----------
  let wsSelection = null; // { ranges:[{start,end},...], presetGeneral, presetContextual, presetPos, presetPronunciation }
  let wsPreview = null;   // { loading, error, general, contextual, pos, pronunciation }
  let wsPreviewToken = 0; // 非同期取得の競合(古い結果の上書き)を防ぐための連番

  function phraseTextFromRange(startIdx, endIdx) {
    return currentTokens.slice(startIdx, endIdx + 1).join(' ').replace(/^[.,!?;:"'\u2018\u2019\u201c\u201d()]+|[.,!?;:"'\u2018\u2019\u201c\u201d()]+$/g, '');
  }
  function phraseKeyFromRange(startIdx, endIdx) {
    return currentTokens.slice(startIdx, endIdx + 1).map(function(w) { return cleanWord(w).toLowerCase(); }).join(' ');
  }
  function phraseTextFromRanges(ranges) {
    return ranges.map(function(r) { return phraseTextFromRange(r.start, r.end); }).join(' … ');
  }
  function phraseKeyFromRanges(ranges) {
    return ranges.map(function(r) { return phraseKeyFromRange(r.start, r.end); }).join(' ... ');
  }

  function renderWsPreview() {
    const el = document.getElementById('ws-preview');
    const confirmBtn = document.getElementById('ws-confirm');
    if (!wsPreview || wsPreview.loading) {
      el.innerHTML = '<div class="ws-preview-loading">意味を辿っています…</div>';
      confirmBtn.disabled = true;
    } else if (wsPreview.needsKey) {
      el.innerHTML = '<div class="ws-preview-loading">' + wsPreview.contextual + '</div>';
      confirmBtn.disabled = true;
    } else if (wsPreview.error || (!wsPreview.general && !wsPreview.contextual)) {
      // 何らかの理由で意味が空のまま返ってきた場合も、失敗と同じ扱いにして再試行させる
      el.innerHTML = '<div class="ws-preview-error">取得に失敗しました（タップで再試行）</div>';
      el.querySelector('.ws-preview-error').addEventListener('click', refreshWordSheetPreview);
      confirmBtn.disabled = true;
    } else {
      el.innerHTML =
        (wsPreview.general ? '<div class="ws-preview-block"><span class="ws-preview-label">辞書的には</span><span class="ws-preview-general">' + wsPreview.general + '</span></div>' : '') +
        (wsPreview.contextual ? '<div class="ws-preview-block"><span class="ws-preview-label">この場面では</span><span class="ws-preview-contextual">' + wsPreview.contextual + '</span></div>' : '');
      confirmBtn.disabled = false;
    }
    renderWsPos();
  }

  function renderWsPos() {
    const parts = [];
    const pron = (wsPreview && wsPreview.pronunciation) || wsSelection.presetPronunciation;
    const pos = (wsPreview && wsPreview.pos) || wsSelection.presetPos;
    if (pron) parts.push(pron);
    if (pos) parts.push(pos);
    document.getElementById('ws-pos').textContent = parts.join('　・　');
  }

  async function refreshWordSheetPreview() {
    if (!wsSelection) return;
    const ranges = wsSelection.ranges;
    const key = phraseKeyFromRanges(ranges);
    const myToken = ++wsPreviewToken;

    // 空のキャッシュ/プリセット(何らかの理由で意味が空のまま保存されたもの)は
    // 使えるデータとみなさず、必ずAIへ再取得しにいく
    const cached = getMeaningFromCache(current, key);
    if (cached && (cached.general || cached.contextual)) {
      wsPreview = { loading: false, error: false, general: cached.general || '', contextual: cached.contextual || '', pos: cached.pos || '', pronunciation: cached.pronunciation || '' };
      renderWsPreview();
      return;
    }
    if (wsSelection.presetGeneral || wsSelection.presetContextual) {
      wsPreview = {
        loading: false, error: false,
        general: wsSelection.presetGeneral || '', contextual: wsSelection.presetContextual || '',
        pos: wsSelection.presetPos || '', pronunciation: wsSelection.presetPronunciation || ''
      };
      saveMeaningToCache(current, key, { general: wsPreview.general, contextual: wsPreview.contextual, pos: wsPreview.pos, pronunciation: wsPreview.pronunciation });
      renderWsPreview();
      return;
    }

    const apiKey = getApiKey();
    if (!apiKey) {
      wsPreview = { loading: false, error: false, needsKey: true, general: '', contextual: 'APIキー未設定（右上の設定から入力してください）', pos: '', pronunciation: '' };
      renderWsPreview();
      return;
    }

    wsPreview = { loading: true, error: false };
    renderWsPreview();

    const word = phraseTextFromRanges(ranges);
    const paragraphEn = pagesEn[current];
    const paragraphJp = pagesJp[current];
    const prompt = 'あなたは英語小説を読む学習者を助ける辞書です。以下の英文の一節の中の「' + word + '」という語句について日本語で説明してください。' +
      'これが熟語・句動詞・慣用句・離れた位置にある構文である場合は、その旨も踏まえてください。\n\n' +
      '英文: ' + paragraphEn + '\n\n' +
      '参考(日本語訳): ' + paragraphJp + '\n\n' +
      '対象の語句: ' + word + '\n\n' +
      '出力は次のJSON形式のみとし、前置き・コードブロック記号は付けないでください。\n' +
      '{"partOfSpeech":"単語なら実際の品詞(名詞/動詞/形容詞など)、熟語等ならその種別(熟語/句動詞/慣用句/構文)",' +
      '"pronunciation":"単語なら発音記号(IPA)。熟語等で馴染まなければ空文字",' +
      '"meaningGeneral":"一般的な辞書のような、文脈に依存しない簡潔な訳語(15字以内)",' +
      '"meaningContextual":"この文中での使われ方を、雰囲気や感情のニュアンスも込めて生き生きと(25〜45字程度)"}';

    try {
      const raw = await callGemini(prompt);
      const jsonStr = raw.trim().replace(/```json/gi, '').replace(/```/g, '').trim();
      const parsed = JSON.parse(jsonStr);
      const general = (parsed.meaningGeneral || '').trim();
      const contextual = (parsed.meaningContextual || '').trim();
      const pos = (parsed.partOfSpeech || '').trim();
      const pronunciation = (parsed.pronunciation || '').trim();
      if (!general && !contextual) throw new Error('空の応答');
      if (myToken !== wsPreviewToken) return; // その間に選択範囲が変わっていたら結果は捨てる
      wsPreview = { loading: false, error: false, general: general, contextual: contextual, pos: pos, pronunciation: pronunciation };
      saveMeaningToCache(current, key, { general: general, contextual: contextual, pos: pos, pronunciation: pronunciation });
    } catch (e) {
      console.warn('単語の意味取得に失敗:', e);
      if (myToken !== wsPreviewToken) return;
      wsPreview = { loading: false, error: true };
    }
    renderWsPreview();
  }

  function renderWordSheet() {
    const ranges = wsSelection.ranges;
    document.getElementById('ws-phrase').textContent = phraseTextFromRanges(ranges);
    const isSingleRange = ranges.length === 1;
    document.getElementById('ws-extend-row').style.display = isSingleRange ? 'flex' : 'none';
    if (isSingleRange) {
      document.getElementById('ws-extend-prev').disabled = ranges[0].start <= 0;
      document.getElementById('ws-extend-next').disabled = ranges[0].end >= currentTokens.length - 1;
    }
    renderWsPreview();
  }

  function openWordSheet(idx) {
    const groups = pageHighlightsByPage[current] || [];
    const indexMap = pageHighlightIndexByPage[current] || {};
    let ranges = [{ start: idx, end: idx }];
    let presetGeneral = null, presetContextual = null, presetPos = null, presetPronunciation = null;
    // タップした位置がAIハイライト済みグループの範囲内なら、そのグループ全体(飛び飛びの場合も含む)を初期選択にする
    if (indexMap[idx] !== undefined) {
      const group = groups[indexMap[idx]];
      if (group) {
        ranges = group.ranges;
        presetGeneral = group.general; presetContextual = group.contextual;
        presetPos = group.pos; presetPronunciation = group.pronunciation;
      }
    }
    wsSelection = { ranges: ranges, presetGeneral: presetGeneral, presetContextual: presetContextual, presetPos: presetPos, presetPronunciation: presetPronunciation };
    wsPreview = null;
    renderWordSheet();
    refreshWordSheetPreview();
    document.getElementById('word-sheet-modal').classList.add('show');
  }
  function closeWordSheet() {
    document.getElementById('word-sheet-modal').classList.remove('show');
    wsSelection = null;
    wsPreview = null;
  }

  document.getElementById('ws-extend-prev').addEventListener('click', function() {
    if (!wsSelection || wsSelection.ranges.length !== 1 || wsSelection.ranges[0].start <= 0) return;
    wsSelection.ranges[0].start--;
    wsSelection.presetGeneral = null; wsSelection.presetContextual = null; wsSelection.presetPos = null; wsSelection.presetPronunciation = null; // 範囲が変わったので既知の意味は使わない
    renderWordSheet();
    refreshWordSheetPreview();
  });
  document.getElementById('ws-extend-next').addEventListener('click', function() {
    if (!wsSelection || wsSelection.ranges.length !== 1 || wsSelection.ranges[0].end >= currentTokens.length - 1) return;
    wsSelection.ranges[0].end++;
    wsSelection.presetGeneral = null; wsSelection.presetContextual = null; wsSelection.presetPos = null; wsSelection.presetPronunciation = null;
    renderWordSheet();
    refreshWordSheetPreview();
  });
  document.getElementById('ws-cancel').addEventListener('click', closeWordSheet);
  document.getElementById('word-sheet-modal').addEventListener('click', function(e) {
    if (e.target === document.getElementById('word-sheet-modal')) closeWordSheet();
  });
  document.getElementById('ws-confirm').addEventListener('click', function() {
    if (!wsSelection || !wsPreview || wsPreview.loading || wsPreview.error || wsPreview.needsKey) return;
    const ranges = wsSelection.ranges;
    const key = phraseKeyFromRanges(ranges);
    const word = phraseTextFromRanges(ranges);
    if (!marginNotesByPage[current]) marginNotesByPage[current] = [];
    // 同じ語句が既に登録済みなら重複追加しない
    if (marginNotesByPage[current].some(function(n) { return n.key === key; })) { closeWordSheet(); return; }

    const note = {
      ranges: ranges, key: key, word: word,
      general: wsPreview.general || '', contextual: wsPreview.contextual || '',
      // 意味の再取得結果に品詞・発音記号が無い場合は、AIが事前に提示していた情報にフォールバックする
      pos: wsPreview.pos || wsSelection.presetPos || '',
      pronunciation: wsPreview.pronunciation || wsSelection.presetPronunciation || '',
      loading: false, error: false, pageIndex: current
    };
    marginNotesByPage[current].push(note);
    saveMarginNotesToStorage();
    closeWordSheet();
    markTappedWordsOnPage();
    renderMarginList();
  });

  function render() {
    renderPageText(pagesEn[current]);
    document.getElementById('jp-translation-text').textContent = pagesJp[current];
    resetCommentaryUI();
    document.getElementById('page-num').textContent = (current + 1) + " / " + pagesEn.length;
    document.getElementById('btn-prev').disabled = current === 0;
    document.getElementById('btn-next').disabled = current === pagesEn.length - 1;
    applyHighlightsToDom();
    markTappedWordsOnPage();
    renderMarginList();
    document.getElementById('page-text').scrollTop = 0;
    ensureHighlightsForPage(current);
  }

  document.getElementById('btn-prev').addEventListener('click', function() {
    if (current > 0) { current--; render(); }
  });
  document.getElementById('btn-next').addEventListener('click', function() {
    if (current < pagesEn.length - 1) { current++; render(); }
  });

  // ---------- 日本語訳シートの開閉・高さ(半分/全画面)の管理 ----------
  let jpHeightHalf = 300;
  let jpHeightFull = 500;
  let jpState = 'half'; // 'half' | 'full'
  const jpSheetEl = document.getElementById('jp-sheet');

  function openJpSheet() {
    jpVisible = true;
    jpState = 'half';
    jpSheetEl.style.transition = 'none';
    jpSheetEl.style.height = jpHeightHalf + 'px';
    // transformのtransitionだけ効かせるため、高さ確定後に戻す
    void jpSheetEl.offsetHeight;
    jpSheetEl.style.transition = 'transform 0.25s ease, height 0.25s ease';
    jpSheetEl.classList.add('show');
  }
  function closeJpSheet() {
    jpVisible = false;
    jpSheetEl.classList.remove('show');
  }
  document.getElementById('btn-toggle-jp').addEventListener('click', function(e) {
    e.stopPropagation();
    if (jpVisible) { closeJpSheet(); } else { openJpSheet(); }
  });
  // シート外(本文エリアなど)をタップしたら閉じる
  document.addEventListener('click', function(e) {
    if (!jpVisible) return;
    if (jpSheetEl.contains(e.target)) return;
    closeJpSheet();
  });

  // ---------- ドラッグハンドル: 上に引くと全画面、下に引くと半分/閉じる ----------
  (function() {
    const handle = document.getElementById('jp-drag-handle');
    let dragging = false;
    let startY = 0;
    let startHeight = 0;

    handle.addEventListener('pointerdown', function(e) {
      dragging = true;
      startY = e.clientY;
      startHeight = jpSheetEl.getBoundingClientRect().height;
      jpSheetEl.style.transition = 'none';
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', function(e) {
      if (!dragging) return;
      const delta = startY - e.clientY; // 上にドラッグ = 正の値
      let h = startHeight + delta;
      h = Math.min(jpHeightFull, Math.max(60, h));
      jpSheetEl.style.height = h + 'px';
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      jpSheetEl.style.transition = 'transform 0.25s ease, height 0.25s ease';
      const h = jpSheetEl.getBoundingClientRect().height;
      const midPoint = (jpHeightHalf + jpHeightFull) / 2;
      if (h < jpHeightHalf * 0.55) {
        // 大きく下に引いたら閉じる
        jpSheetEl.style.height = jpHeightHalf + 'px';
        closeJpSheet();
        jpState = 'half';
      } else if (h > midPoint) {
        jpState = 'full';
        jpSheetEl.style.height = jpHeightFull + 'px';
      } else {
        jpState = 'half';
        jpSheetEl.style.height = jpHeightHalf + 'px';
      }
    }
    handle.addEventListener('pointerup', endDrag);
    handle.addEventListener('pointercancel', endDrag);
  })();

  // ---------- 操作バーの高さをCSS変数に反映(日本語訳シートがバーと重ならないようにする) ----------
  function syncFooterHeight() {
    const footer = document.querySelector('.book-footer');
    const bookCol = document.querySelector('.book-col');
    if (footer) {
      document.documentElement.style.setProperty('--footer-h', footer.offsetHeight + 'px');
    }
    // 日本語訳シートの「半分」「全画面」それぞれの高さを実測して更新する
    if (footer && bookCol) {
      const available = bookCol.clientHeight - footer.offsetHeight;
      jpHeightFull = Math.max(200, available - 50); // 上部が少し見える余白を残す
      jpHeightHalf = Math.max(160, Math.round(available * 0.5));
      // 開いている最中にリサイズされた場合、現在の状態に合わせて高さを再適用
      if (jpVisible) {
        jpSheetEl.style.height = (jpState === 'full' ? jpHeightFull : jpHeightHalf) + 'px';
      }
    }
  }
  window.addEventListener('resize', syncFooterHeight);
  window.addEventListener('orientationchange', syncFooterHeight);
  syncFooterHeight();

  // ---------- 巻物画像の羊皮紙部分に合わせて本文エリアの位置・大きさを実測配置する ----------
  // 背景はbackground-size:coverなので、コンテナと画像の縦横比によって
  // 実際に見えている範囲が変わる。それをここで計算し、羊皮紙の安全な範囲に
  // 本文エリア(#page-text)がぴったり収まるようにする。
  var SCROLL_IMG_W = 864, SCROLL_IMG_H = 1229;
  var SCROLL_SAFE = { left: 0.23, right: 0.77, top: 0.27, bottom: 0.74 };
  function positionPageOverlay() {
    const scrollEl = document.querySelector('.page-scroll');
    const pageEl = document.getElementById('page-text');
    if (!scrollEl || !pageEl) return;
    const cw = scrollEl.clientWidth, ch = scrollEl.clientHeight;
    if (!cw || !ch) return;
    const scale = Math.max(cw / SCROLL_IMG_W, ch / SCROLL_IMG_H);
    const dispW = SCROLL_IMG_W * scale, dispH = SCROLL_IMG_H * scale;
    const offX = (cw - dispW) / 2, offY = (ch - dispH) / 2;
    const safeTopPx = offY + SCROLL_SAFE.top * dispH;
    const safeBottomPx = offY + SCROLL_SAFE.bottom * dispH;
    pageEl.style.left = (offX + SCROLL_SAFE.left * dispW) + 'px';
    pageEl.style.right = (cw - (offX + SCROLL_SAFE.right * dispW)) + 'px';
    pageEl.style.top = safeTopPx + 'px';
    // 高さは中身に応じて伸び縮みさせ、羊皮紙の安全域を超えたらそこでスクロールに切り替える
    pageEl.style.bottom = '';
    pageEl.style.maxHeight = Math.max(60, safeBottomPx - safeTopPx) + 'px';
  }
  window.addEventListener('resize', positionPageOverlay);
  window.addEventListener('orientationchange', positionPageOverlay);
  positionPageOverlay();

  // 画面ロック解除やアプリ切り替えから戻った時は resize が発火しないことがあるため、
  // 可視状態に戻ったタイミングでも配置とシート高さを再計算する
  function resyncLayoutAfterReturn() {
    if (document.visibilityState !== 'visible') return;
    positionPageOverlay();
    syncFooterHeight();
    // 戻った直後はブラウザのUI(アドレスバー等)がまだ確定していないことがあるため、
    // 少し待ってからもう一度実施する
    setTimeout(function() {
      positionPageOverlay();
      syncFooterHeight();
    }, 300);
  }
  document.addEventListener('visibilitychange', resyncLayoutAfterReturn);
  window.addEventListener('pageshow', resyncLayoutAfterReturn);
  window.addEventListener('focus', resyncLayoutAfterReturn);

  // ---------- 設定モーダル ----------
  const settingsModal = document.getElementById('settings-modal');
  const apiKeyInput = document.getElementById('api-key-input');
  document.getElementById('btn-settings').addEventListener('click', function() {
    apiKeyInput.value = getApiKey();
    settingsModal.classList.add('show');
  });
  document.getElementById('btn-settings-cancel').addEventListener('click', function() {
    settingsModal.classList.remove('show');
  });
  document.getElementById('btn-settings-save').addEventListener('click', function() {
    setApiKey(apiKeyInput.value.trim());
    settingsModal.classList.remove('show');
    ensureHighlightsForPage(current);
  });
  settingsModal.addEventListener('click', function(e) {
    if (e.target === settingsModal) settingsModal.classList.remove('show');
  });
  updateSettingsButtonState();

  // ---------- 縦向き検知 ----------
  function checkOrientation() {
    const isPortrait = window.innerHeight > window.innerWidth;
    document.body.classList.toggle('is-portrait', isPortrait);
  }
  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', checkOrientation);
  checkOrientation();

  // ---------- 文字サイズ調整 ----------
  const FONT_SIZE_MIN = 0.8, FONT_SIZE_MAX = 1.5, FONT_SIZE_STEP = 0.1;
  let currentFontSize = parseFloat(localStorage.getItem('lovecraft_font_size') || '1.05');
  function applyFontSize() {
    document.documentElement.style.setProperty('--page-font-size', currentFontSize + 'rem');
    localStorage.setItem('lovecraft_font_size', String(currentFontSize));
  }
  document.getElementById('btn-font-minus').addEventListener('click', function() {
    currentFontSize = Math.max(FONT_SIZE_MIN, Math.round((currentFontSize - FONT_SIZE_STEP) * 10) / 10);
    applyFontSize();
  });
  document.getElementById('btn-font-plus').addEventListener('click', function() {
    currentFontSize = Math.min(FONT_SIZE_MAX, Math.round((currentFontSize + FONT_SIZE_STEP) * 10) / 10);
    applyFontSize();
  });
  applyFontSize();

  loadMarginNotesFromStorage();
  render();
</script>
</body>
</html>
